name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - run: pip install -r requirements-dev.txt
    - name: Import check
      run: python -c "import main; assert len(main.app.routes) > 0"
    - name: Run tests
      run: pytest
      env:
        GEMINI_API_KEY: ""
